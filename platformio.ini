; Entorno de compilacion de prueba para M5PaperSeedWorkstation.
; El build real se hace con Arduino IDE; esto sirve para validar que compila.
;
; Targets:
;   native  -> M5Paper (540x960, e-ink M5EPD)   [target estable]
;   m5core2 -> M5Stack Core2 (320x240, M5Unified/M5GFX)  [en desarrollo]
;
; Uso:
;   ~/.platformio/penv/bin/pio run -e native
;   ~/.platformio/penv/bin/pio run -e m5core2
; La libreria M5EPD esta en ~/Documents/Arduino/libraries.

[platformio]
src_dir = .
default_envs = native

[env:native]
platform = espressif32@5.0.0
board = m5stack-fire
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries/M5EPD
lib_deps = h2zero/NimBLE-Arduino@^1.4.0
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
build_flags =
    -DTARGET_M5PAPER
    -DARDUINO_M5STACK_PAPER
build_src_filter =
    +<*>
    -<lib/*>
    -<NativeApp_Core2.cpp>

[env:m5core2]
platform = espressif32@5.0.0
board = m5stack-core2
framework = arduino
lib_deps =
    m5stack/M5Unified@^0.2.2
    h2zero/NimBLE-Arduino@^1.4.0
monitor_speed = 115200
build_flags =
    -DTARGET_M5CORE2
build_src_filter =
    +<*>
    -<lib/*>
    -<NativeApp.cpp>

; ---------------------------------------------------------------------------
; Tests unitarios en el host (nativo). No requiere hardware.
;
; Uso:
;   ~/.platformio/penv/bin/pio test -e host
;
; Requiere mbedtls en el host (se usa la rama 2.28, la misma que el ESP32):
;   - macOS:  brew install mbedtls@2
;   - Linux:  apt-get install libmbedtls-dev  (2.x o 3.x; el compat header
;             de test/mocks/mbedtls_compat.h se adapta a mbedtls 3.x)
;
; Las rutas de mbedtls se listan aqui en build_flags (los directorios -I/-L
; inexistentes son ignorados por el compilador/enlazador). Si mbedtls esta en
; otra ubicacion, anade su -I/-L aqui.
; ---------------------------------------------------------------------------
[env:host]
platform = native
test_framework = unity
build_src_filter = -<*>
lib_ignore = seedworkstation_core
build_flags =
    -DTARGET_M5PAPER
    -I test
    -I test/mocks
    -I lib/seedworkstation_core/src
    -include mbedtls_compat.h
    -I /Users/macro/homebrew/opt/mbedtls@2/include
    -I /opt/homebrew/opt/mbedtls@2/include
    -I /usr/local/opt/mbedtls@2/include
    -L /Users/macro/homebrew/opt/mbedtls@2/lib
    -L /opt/homebrew/opt/mbedtls@2/lib
    -L /usr/local/opt/mbedtls@2/lib
    -lmbedtls -lmbedx509 -lmbedcrypto
